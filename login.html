<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SpendSmart</title>
    <meta name="description" content="Log in to your SpendSmart account to manage expenses, track budgets, and reach your financial goals.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="light-theme">
    <div id="toast-container" class="toast-container"></div>
    
    <div class="auth-container">
        <div class="auth-card card">
            <div class="back-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
            </div>
            
            <div class="auth-header">
                <div class="auth-logo"><i class="fa-solid fa-wallet"></i></div>
                <h2>Welcome Back</h2>
                <p>Log in to access your dashboard</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <a href="#" class="forgot-password" id="forgotPasswordLink">Forgot password?</a>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    <span>Log In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Forgot Password Form (hidden by default) -->
            <form id="forgotPasswordForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="resetEmail" placeholder="you@example.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <span>Send Reset Link</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
                <p class="text-center mt-3">
                    <a href="#" id="backToLogin" style="font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
                </p>
            </form>
            
            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>
    
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
